name: Build APK All-in-One

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Entire Android Project Structure
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/example/tvadskipper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVAdSkipper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.tvadskipper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvadskipper"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="TV廣告跳過助手"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".AdSkipperService"
                      android:exported="true"
                      android:label="TV廣告自動返回服務"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tvadskipper/AdSkipperService.kt
          package com.example.tvadskipper

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper

          class AdSkipperService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTriggerTime = 0L
              private val cooldownMillis = 2500L

              // 針對「按广告返回15秒」及常見廣告字眼設定關鍵字
              private val adKeywords = listOf(
                  "按广告", "广告返回", "按廣告", "廣告返回",
                  "广告", "跳过", "秒后", "倒计时",
                  "廣告", "跳過", "略過", "秒後", 
                  "Sponsored", "Skip Ad"
              )

              // 每 800 毫秒主動掃描一次電視畫面，不依賴播放器的被動通知
              private val scanRunnable = object : Runnable {
                  override fun run() {
                      checkScreenForAds()
                      handler.postDelayed(this, 800)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Toast.makeText(applicationContext, "TV廣告自動巡邏已啟動！", Toast.LENGTH_SHORT).show()
                  handler.post(scanRunnable)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  checkScreenForAds()
              }

              private fun checkScreenForAds() {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastTriggerTime < cooldownMillis) return

                  var adNode: AccessibilityNodeInfo? = findAdNode(rootInActiveWindow)

                  if (adNode == null) {
                      for (window in windows) {
                          adNode = findAdNode(window.root)
                          if (adNode != null) break
                      }
                  }

                  if (adNode != null) {
                      lastTriggerTime = currentTime

                      handler.post {
                          Toast.makeText(applicationContext, "抓到廣告！執行跳過...", Toast.LENGTH_SHORT).show()
                      }

                      // 動作 1：如果該小框本身支援點擊，直接幫你點它
                      adNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      adNode.parent?.performAction(AccessibilityNodeInfo.ACTION_CLICK)

                      // 動作 2：立即發送返回鍵，並在 0.4 秒後補發第二次確保退出
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      handler.postDelayed({
                          performGlobalAction(GLOBAL_ACTION_BACK)
                      }, 400)
                  }
              }

              private fun findAdNode(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (node == null) return null

                  val text = node.text?.toString() ?: ""
                  val contentDesc = node.contentDescription?.toString() ?: ""
                  val viewId = node.viewIdResourceName ?: ""

                  for (keyword in adKeywords) {
                      if (text.contains(keyword, ignoreCase = true) || 
                          contentDesc.contains(keyword, ignoreCase = true)) {
                          return node
                      }
                  }

                  // 額外檢查元件 ID 是否明顯為廣告跳過按鈕
                  if (viewId.contains("skip_ad", ignoreCase = true) || 
                      viewId.contains("ad_countdown", ignoreCase = true)) {
                      return node
                  }

                  for (i in 0 until node.childCount) {
                      val found = findAdNode(node.getChild(i))
                      if (found != null) return found
                  }
                  return null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(scanRunnable)
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(scanRunnable)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Ad-Skipper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
