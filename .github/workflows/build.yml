name: Build APK All-in-One

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Entire Android Project Structure
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/example/tvadskipper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVAdSkipper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.tvadskipper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvadskipper"
                  minSdk 21
                  targetSdk 34
                  versionCode 12
                  versionName "2.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="TV廣告跳過助手"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".AdSkipperService"
                      android:exported="true"
                      android:label="TV廣告自動返回服務"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="30" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tvadskipper/AdSkipperService.kt
          package com.example.tvadskipper

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper

          class AdSkipperService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTriggerTime = 0L
              private val cooldownMillis = 2000L

              // 精準對應畫面右上角出現的字眼
              private val adKeywords = listOf(
                  "按返回跳过", "按返回跳過", "按返回", "跳过", "跳過"
              )

              // 防誤觸排除清單：如果畫面上有暫停或繼續播放，絕對不按返回
              private val pauseIgnoreKeywords = listOf(
                  "繼續播放", "继续播放", "按返回繼續", "按返回继续", "暫停", "暂停"
              )

              private val scanRunnable = object : Runnable {
                  override fun run() {
                      checkAndSkip()
                      handler.postDelayed(this, 250) // 每 0.25 秒高速掃描
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Toast.makeText(applicationContext, "極流TV廣告攔截已啟動！", Toast.LENGTH_SHORT).show()
                  handler.post(scanRunnable)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  checkAndSkip()
              }

              private fun checkAndSkip() {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastTriggerTime < cooldownMillis) return

                  val root = rootInActiveWindow ?: return

                  // 1. 檢查是否處於手動暫停狀態，若是則略過
                  if (isPauseScreen(root)) return

                  // 2. 掃描畫面是否包含「按返回跳过」等關鍵字
                  if (hasAdText(root)) {
                      lastTriggerTime = currentTime

                      handler.post {
                          Toast.makeText(applicationContext, "偵測到返回跳過廣告，執行返回！", Toast.LENGTH_SHORT).show()
                      }

                      // 強制執行全域返回鍵
                      performGlobalAction(GLOBAL_ACTION_BACK)
                  } else {
                      // 檢查所有浮動視窗
                      for (window in windows) {
                          if (window.root != null && hasAdText(window.root)) {
                              lastTriggerTime = currentTime
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              break
                          }
                      }
                  }
              }

              private fun hasAdText(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  val text = node.text?.toString() ?: ""
                  val contentDesc = node.contentDescription?.toString() ?: ""

                  for (keyword in adKeywords) {
                      if (text.contains(keyword, ignoreCase = true) || 
                          contentDesc.contains(keyword, ignoreCase = true)) {
                          return true
                      }
                  }

                  for (i in 0 until node.childCount) {
                      if (hasAdText(node.getChild(i))) return true
                  }
                  return false
              }

              private fun isPauseScreen(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  val text = node.text?.toString() ?: ""
                  val contentDesc = node.contentDescription?.toString() ?: ""

                  for (ignoreWord in pauseIgnoreKeywords) {
                      if (text.contains(ignoreWord, ignoreCase = true) || 
                          contentDesc.contains(ignoreWord, ignoreCase = true)) {
                          return true
                      }
                  }

                  for (i in 0 until node.childCount) {
                      if (isPauseScreen(node.getChild(i))) return true
                  }
                  return false
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(scanRunnable)
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(scanRunnable)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Ad-Skipper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
