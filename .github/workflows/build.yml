name: Build APK All-in-One

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Entire Android Project Structure
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/example/tvadskipper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVAdSkipper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.tvadskipper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvadskipper"
                  minSdk 21
                  targetSdk 34
                  versionCode 11
                  versionName "2.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="TV廣告跳過助手"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".AdSkipperService"
                      android:exported="true"
                      android:label="TV廣告自動返回服務"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="30" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tvadskipper/AdSkipperService.kt
          package com.example.tvadskipper

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper

          class AdSkipperService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTriggerTime = 0L
              private val cooldownMillis = 2000L

              // 專門鎖定廣告框架與右上角跳過按鈕 ID[cite: 1]
              private val targetSkipBtnId = "com.streamflixtv.brave.retreat:id/tv_utv_player_ad_skip"
              private val targetOverlayId = "com.streamflixtv.brave.retreat:id/utv_ad_overlay"

              private val scanRunnable = object : Runnable {
                  override fun run() {
                      checkAndClickSkip()
                      handler.postDelayed(this, 300) // 每 0.3 秒檢查一次
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Toast.makeText(applicationContext, "StreamFlix 安全點擊跳過版已啟動！", Toast.LENGTH_SHORT).show()
                  handler.post(scanRunnable)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  checkAndClickSkip()
              }

              private fun checkAndClickSkip() {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastTriggerTime < cooldownMillis) return

                  val root = rootInActiveWindow ?: return
                  
                  // 尋找右上角跳過按鈕[cite: 1]
                  var skipNode = findNodeById(root, targetSkipBtnId)
                  if (skipNode == null) {
                      for (window in windows) {
                          skipNode = findNodeById(window.root, targetSkipBtnId)
                          if (skipNode != null) break
                      }
                  }

                  // 如果找到跳過按鈕，直接對它發起模擬點擊（絕對不按返回鍵，絕不跳回首頁）
                  if (skipNode != null) {
                      lastTriggerTime = currentTime

                      handler.post {
                          Toast.makeText(applicationContext, "精準點擊廣告跳過按鈕！", Toast.LENGTH_SHORT).show()
                      }

                      skipNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      skipNode.parent?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  }
              }

              private fun findNodeById(node: AccessibilityNodeInfo?, targetId: String): AccessibilityNodeInfo? {
                  if (node == null) return null
                  if (node.viewIdResourceName == targetId) return node

                  for (i in 0 until node.childCount) {
                      val found = findNodeById(node.getChild(i), targetId)
                      if (found != null) return found
                  }
                  return null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(scanRunnable)
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(scanRunnable)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Ad-Skipper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
