name: Build APK All-in-One

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Entire Android Project Structure
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/example/tvadskipper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVAdSkipper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.tvadskipper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvadskipper"
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName "1.6"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="TV廣告跳過助手"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".AdSkipperService"
                      android:exported="true"
                      android:label="TV廣告自動返回服務"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tvadskipper/AdSkipperService.kt
          package com.example.tvadskipper

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper

          class AdSkipperService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTriggerTime = 0L
              private val cooldownMillis = 3000L

              // 結合先前抓到的 utv_ad_overlay ID 與常見的廣告/秒數關鍵字
              private val adKeywords = listOf(
                  "utv_ad_overlay", "tv_utv_player_ad_skip",
                  "按广告", "广告返回", "按廣告", "廣告返回",
                  "跳过", "秒后", "跳過", "秒後"
              )

              private val scanRunnable = object : Runnable {
                  override fun run() {
                      checkAndSkipAds()
                      handler.postDelayed(this, 400) // 每 0.4 秒高速巡邏一次
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Toast.makeText(applicationContext, "StreamFlix 廣告終極秒殺版已啟動！", Toast.LENGTH_SHORT).show()
                  handler.post(scanRunnable)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  checkAndSkipAds()
              }

              private fun checkAndSkipAds() {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastTriggerTime < cooldownMillis) return

                  val root = rootInActiveWindow ?: return
                  if (hasAdElement(root)) {
                      triggerAdSkip()
                      return
                  }

                  for (window in windows) {
                      if (hasAdElement(window.root)) {
                          triggerAdSkip()
                          return
                      }
                  }
              }

              private fun triggerAdSkip() {
                  lastTriggerTime = System.currentTimeMillis()

                  handler.post {
                      Toast.makeText(applicationContext, "強制執行廣告返回！", Toast.LENGTH_SHORT).show()
                  }

                  // 執行系統無障礙返回
                  performGlobalAction(GLOBAL_ACTION_BACK)

                  // 雙重保險：透過執行緒額外補發一次，確保畫面退出
                  handler.postDelayed({
                      performGlobalAction(GLOBAL_ACTION_BACK)
                  }, 300)
              }

              private fun hasAdElement(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false

                  val viewId = node.viewIdResourceName ?: ""
                  val text = node.text?.toString() ?: ""
                  val contentDesc = node.contentDescription?.toString() ?: ""

                  for (keyword in adKeywords) {
                      if (viewId.contains(keyword, ignoreCase = true) ||
                          text.contains(keyword, ignoreCase = true) ||
                          contentDesc.contains(keyword, ignoreCase = true)) {
                          return true
                      }
                  }

                  for (i in 0 until node.childCount) {
                      if (hasAdElement(node.getChild(i))) return true
                  }
                  return false
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(scanRunnable)
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(scanRunnable)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Ad-Skipper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
