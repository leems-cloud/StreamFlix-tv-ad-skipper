name: Build APK All-in-One

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Entire Android Project Structure
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/example/tvadskipper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVAdSkipper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.tvadskipper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvadskipper"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="TV廣告跳過助手"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".AdSkipperService"
                      android:exported="true"
                      android:label="TV廣告自動返回服務"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 加入 flagRetrieveInteractiveWindows 確保能抓到右上角浮動小框
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tvadskipper/AdSkipperService.kt
          package com.example.tvadskipper

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper

          class AdSkipperService : AccessibilityService() {

              private var lastTriggerTime = 0L
              private val cooldownMillis = 2500L // 2.5秒冷卻時間

              // 繁簡體廣告關鍵字全包（包含你看到的「按广告返回」）
              private val adKeywords = listOf(
                  "按广告", "广告返回", "按廣告", "廣告返回",
                  "广告", "跳过", "秒后", 
                  "廣告", "跳過", "略過", "秒後", 
                  "Sponsored", "Skip Ad"
              )

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  var foundAd = false

                  // 1. 檢查主視窗與事件來源節點
                  if (containsAdKeyword(rootInActiveWindow) || containsAdKeyword(event?.source)) {
                      foundAd = true
                  }

                  // 2. 檢查所有浮動視窗/小框圖層 (針對右上角獨立小框)
                  if (!foundAd) {
                      for (window in windows) {
                          if (containsAdKeyword(window.root)) {
                              foundAd = true
                              break
                          }
                      }
                  }

                  if (foundAd) {
                      val currentTime = System.currentTimeMillis()
                      if (currentTime - lastTriggerTime > cooldownMillis) {
                          lastTriggerTime = currentTime
                          
                          // 在電視螢幕下方彈出提示，方便確認外掛已成功抓到文字
                          Handler(Looper.getMainLooper()).post {
                              Toast.makeText(applicationContext, "偵測到廣告！自動按返回鍵", Toast.LENGTH_SHORT).show()
                          }

                          // 執行全域返回鍵
                          performGlobalAction(GLOBAL_ACTION_BACK)
                      }
                  }
              }

              private fun containsAdKeyword(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false

                  val text = node.text?.toString() ?: ""
                  val contentDesc = node.contentDescription?.toString() ?: ""

                  for (keyword in adKeywords) {
                      if (text.contains(keyword, ignoreCase = true) || 
                          contentDesc.contains(keyword, ignoreCase = true)) {
                          return true
                      }
                  }

                  for (i in 0 until node.childCount) {
                      if (containsAdKeyword(node.getChild(i))) {
                          return true
                      }
                  }
                  return false
              }

              override fun onInterrupt() {}
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Ad-Skipper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
