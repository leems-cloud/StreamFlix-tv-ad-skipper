name: Build APK All-in-One

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Entire Android Project Structure
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/example/tvadskipper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVAdSkipper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.tvadskipper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvadskipper"
                  minSdk 30
                  targetSdk 34
                  versionCode 15
                  versionName "3.1-Screenshot"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="TV廣告截圖識別助手"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".ScreenshotAdService"
                      android:exported="true"
                      android:label="TV廣告智慧截圖服務"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestFingerprintGestures"
              android:canTakeScreenshot="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tvadskipper/ScreenshotAdService.kt
          package com.example.tvadskipper

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          class ScreenshotAdService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTriggerTime = 0L
              private val cooldownMillis = 3000L
              private var isScanning = false

              private val screenshotRunnable = object : Runnable {
                  override fun run() {
                      captureAndAnalyzeScreen()
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Toast.makeText(applicationContext, "TV廣告智慧截圖辨識已啟動！", Toast.LENGTH_SHORT).show()
                  handler.post(screenshotRunnable)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              private fun captureAndAnalyzeScreen() {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastTriggerTime < cooldownMillis || isScanning) return
                  if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.R) return

                  isScanning = true
                  takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                      override fun onSuccess(screenshot: ScreenshotResult) {
                          try {
                              val hardwareBitmap = Bitmap.wrapHardwareBuffer(screenshot.hardwareBuffer, screenshot.colorSpace)
                              if (hardwareBitmap != null) {
                                  val bitmap = hardwareBitmap.copy(Bitmap.Config.ARGB_8888, false)
                                  hardwareBitmap.recycle()

                                  if (bitmap != null) {
                                      if (checkRegionForAd(bitmap)) {
                                          lastTriggerTime = System.currentTimeMillis()
                                          handler.post {
                                              Toast.makeText(applicationContext, "影像辨識到廣告，執行返回！", Toast.LENGTH_SHORT).show()
                                          }
                                          performGlobalAction(GLOBAL_ACTION_BACK)
                                      }
                                      bitmap.recycle()
                                  }
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          } finally {
                              isScanning = false
                          }
                      }

                      override fun onFailure(errorCode: Int) {
                          isScanning = false
                      }
                  })
              }

              private fun checkRegionForAd(bitmap: Bitmap): Boolean {
                  val width = bitmap.width
                  val height = bitmap.height

                  val startX = (width * 0.75).toInt()
                  val endX = width - 10
                  val startY = 10
                  val endY = (height * 0.15).toInt()

                  var targetPixelCount = 0
                  for (x in startX until endX step 15) {
                      for (y in startY until endY step 15) {
                          val pixel = bitmap.getPixel(x, y)
                          val red = Color.red(pixel)
                          val green = Color.green(pixel)
                          val blue = Color.blue(pixel)

                          if (red < 50 && green < 50 && blue < 50) {
                              targetPixelCount++
                          }
                      }
                  }
                  return targetPixelCount > 8
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(screenshotRunnable)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(screenshotRunnable)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Ad-Skipper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
