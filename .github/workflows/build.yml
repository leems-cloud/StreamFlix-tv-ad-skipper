name: Build APK All-in-One

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Entire Android Project Structure
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/example/tvadskipper
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVAdSkipper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.tvadskipper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvadskipper"
                  minSdk 21
                  targetSdk 34
                  versionCode 8
                  versionName "1.7"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="TV廣告跳過助手"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <service
                      android:name=".AdSkipperService"
                      android:exported="true"
                      android:label="TV廣告自動返回服務"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="30" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/tvadskipper/AdSkipperService.kt
          package com.example.tvadskipper

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper

          class AdSkipperService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var lastTriggerTime = 0L
              private val cooldownMillis = 2000L

              // 鎖定你剛才抓到的廣告容器與跳過按鈕 ID[cite: 1]
              private val targetOverlayId = "com.streamflixtv.brave.retreat:id/utv_ad_overlay"
              private val targetSkipBtnId = "com.streamflixtv.brave.retreat:id/tv_utv_player_ad_skip"

              private val scanRunnable = object : Runnable {
                  override fun run() {
                      checkAndDestroyAd()
                      handler.postDelayed(this, 300) // 每 0.3 秒極速巡邏
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Toast.makeText(applicationContext, "StreamFlix 廣告強力點擊版已啟動！", Toast.LENGTH_SHORT).show()
                  handler.post(scanRunnable)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  checkAndDestroyAd()
              }

              private fun checkAndDestroyAd() {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime - lastTriggerTime < cooldownMillis) return

                  val root = rootInActiveWindow ?: return
                  
                  // 尋找右上角跳過按鈕或廣告容器[cite: 1]
                  val skipNode = findNodeById(root, targetSkipBtnId)
                  val overlayNode = findNodeById(root, targetOverlayId)

                  if (skipNode != null || overlayNode != null) {
                      lastTriggerTime = currentTime

                      handler.post {
                          Toast.makeText(applicationContext, "正在強制點擊並關閉廣告...", Toast.LENGTH_SHORT).show()
                      }

                      // 招式 1：如果抓到右上角「跳過按鈕」，直接對它發起點擊
                      if (skipNode != null) {
                          skipNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          // 有時候節點的父容器才是實際接收點擊的元件，一併點擊
                          skipNode.parent?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }

                      // 招式 2：如果抓到整個廣告容器，嘗試點擊它或它的子元件
                      if (overlayNode != null) {
                          overlayNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }

                      // 招式 3：雙管齊下，同時發送全域返回鍵
                      performGlobalAction(GLOBAL_ACTION_BACK)
                  }

                  // 額外掃描所有浮動視窗
                  for (window in windows) {
                      val winSkipNode = findNodeById(window.root, targetSkipBtnId)
                      if (winSkipNode != null) {
                          lastTriggerTime = currentTime
                          winSkipNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          break
                      }
                  }
              }

              private fun findNodeById(node: AccessibilityNodeInfo?, targetId: String): AccessibilityNodeInfo? {
                  if (node == null) return null
                  if (node.viewIdResourceName == targetId) return node

                  for (i in 0 until node.childCount) {
                      val found = findNodeById(node.getChild(i), targetId)
                      if (found != null) return found
                  }
                  return null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(scanRunnable)
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(scanRunnable)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Ad-Skipper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
